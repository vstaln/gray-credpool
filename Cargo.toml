[package]
name = "gray-credpool"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Multi-key credential pool with rotation, cooldown, and failover for gray providers"

[lib]
name = "gray_credpool"
path = "src/lib.rs"

[[bin]]
name = "gray-credpool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
